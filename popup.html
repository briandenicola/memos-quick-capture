<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Memos Quick Capture</title>
  <link rel="stylesheet" href="styles.css">
  <style>body { width: 380px; padding: 12px; }</style>
</head>
<body>
  <div id="unconfigured" hidden>
    <h1>Memos Quick Capture</h1>
    <p>Set your Memos server and access token first.</p>
    <button id="openOptions" class="primary">Open settings</button>
  </div>

  <form id="form" hidden>
    <textarea id="content" placeholder="What's on your mind? (Markdown supported)" autofocus></textarea>
    <label class="check"><input type="checkbox" id="includeLink"> Attach link to this page</label>
    <label class="check" id="appendRow" hidden>
      <input type="checkbox" id="append"> Append to last memo
      <span class="hint snippet" id="lastSnippet"></span>
    </label>
    <div class="row">
      <input type="text" id="tags" placeholder="tags, comma or space separated">
      <select id="visibility" style="flex:0 0 110px">
        <option value="PRIVATE">Private</option>
        <option value="PROTECTED">Workspace</option>
        <option value="PUBLIC">Public</option>
      </select>
    </div>
    <div class="footer">
      <span class="hint">Ctrl+Enter to send · <a href="#" id="settingsLink">settings</a></span>
      <button type="submit" id="send" class="primary">Send</button>
    </div>
    <div id="status" class="status"></div>
  </form>
  <script type="module" src="popup.js"></script>
</body>
</html>
